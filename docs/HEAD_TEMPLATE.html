<!--
  Template de head SEO para páginas do site.
  Substitua [TITLE], [DESCRIPTION], [CANONICAL], [OG_TYPE], [OG_IMAGE] quando necessário.
-->
<head>
  <link rel="icon" type="image/png" sizes="32x32" href="assets/logos/linq-dfe.png">
  <link rel="icon" type="image/png" sizes="16x16" href="assets/logos/linq-dfe.png">
  <link rel="apple-touch-icon" href="assets/logos/linq-dfe.png">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Language" content="pt-BR">
  <title>[TITLE]</title>
  <meta name="description" content="[DESCRIPTION]">
  <meta name="robots" content="index,follow">
  <link rel="canonical" href="[CANONICAL]">
  <meta property="og:type" content="[OG_TYPE]">
  <meta property="og:title" content="[TITLE]">
  <meta property="og:description" content="[DESCRIPTION]">
  <meta property="og:url" content="[CANONICAL]">
  <meta property="og:image" content="[OG_IMAGE]">
  <meta property="og:site_name" content="LINQ-DFE">
  <meta property="og:locale" content="pt_BR">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="[TITLE]">
  <meta name="twitter:description" content="[DESCRIPTION]">
  <meta name="twitter:image" content="[OG_IMAGE]">
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "LINQ-DFE",
      "url": "https://linqdfe.com.br",
      "logo": "https://linqdfe.com.br/assets/logos/linq-dfe.png",
      "sameAs": ["https://instagram.com/linqdfe"]
    }
  </script>
  <link rel="stylesheet" href="css/style.min.css">
</head>
