  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LINQ-DFE | Em atualização</title>
  <meta name="robots" content="noindex,nofollow">
  <style>
    :root {
      --bg: #111827;
      --card: #1f2937;
      --text: #f9fafb;
      --muted: #d1d5db;
      --accent: #ef4444;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at top, #1f2937 0%, var(--bg) 60%);
      color: var(--text);
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      padding: 24px;
    }
    .card {
      width: min(680px, 100%);
      background: rgba(31, 41, 55, 0.92);
      border: 1px solid rgba(239, 68, 68, 0.45);
      border-radius: 14px;
      padding: 28px;
      text-align: center;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.35);
    }
    h1 {
      margin: 0 0 10px;
      font-size: clamp(1.4rem, 3.8vw, 2rem);
      color: var(--text);
    }
    p {
      margin: 8px 0;
      color: var(--muted);
      line-height: 1.6;
    }
    .tag {
      display: inline-block;
      margin-bottom: 12px;
      padding: 6px 12px;
      border-radius: 999px;
      background: rgba(239, 68, 68, 0.16);
      color: #fecaca;
      font-weight: 600;
      font-size: 0.88rem;
      letter-spacing: 0.02em;
    }
  </style>
</head>
<body>
  <main class="card" aria-live="polite">
    <span class="tag">Site temporariamente indisponível</span>
    <h1>Estamos em atualização</h1>
    <p>O portal da LINQ-DFE está temporariamente fechado para ajustes finais.</p>
    <p>O acesso será reaberto no lançamento oficial.</p>
  </main>
</body>
